spring.application.name=pediu-patrao

# Variáveis lidas do arquivo .env (que NÃO vai para o git). Veja .env.example
spring.config.import=optional:file:.env[.properties]

# Conexão do MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:pediupatrao}

# Administrador inicial (criado somente se ainda não existir)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.senha=${ADMIN_PASSWORD:}

# Dashboard: pedido em andamento há mais de X minutos conta como atrasado
app.dashboard.minutos-atraso=${DASHBOARD_MINUTOS_ATRASO:40}

# Pedidos de demonstração para o dashboard (só carrega uma vez; ver DemoDataLoader)
app.demo.carregar=${APP_DEMO_CARREGAR:false}
app.demo.dias=${APP_DEMO_DIAS:60}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Não expõe detalhes internos (stack trace) nas respostas de erro
server.error.include-stacktrace=never
server.error.include-message=always

logging.level.com.umc.pediupatrao=INFO
