spring.application.name=pediu-patrao

# Variáveis lidas do arquivo .env (que NÃO vai para o git). Veja .env.example
spring.config.import=optional:file:.env[.properties]

# Conexão do MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:pediupatrao}

# Administrador inicial (criado somente se ainda não existir)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.senha=${ADMIN_PASSWORD:}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Não expõe detalhes internos (stack trace) nas respostas de erro
server.error.include-stacktrace=never
server.error.include-message=always

logging.level.com.umc.pediupatrao=INFO
