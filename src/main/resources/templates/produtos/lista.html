<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Produtos</title>
</head>
<body>

<!--
    Tela que consome a API REST: o Thymeleaf entrega só a estrutura,
    e o JavaScript busca os produtos em GET /api/produtos.
-->
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <a href="/produtos/novo" id="btnNovoProduto" class="btn btn-primary d-none">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </a>
    </div>

    <div id="mensagem"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th class="text-end">Preço</th>
                        <th>Ativo</th>
                        <th class="text-end pe-4"></th>
                    </tr>
                </thead>
                <tbody id="produtos-tabela">
                    <tr><td colspan="5" class="text-center text-muted py-4">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        (function () {
            const tabela = document.getElementById('produtos-tabela');
            const mensagem = document.getElementById('mensagem');
            const podeEditar = temPerfil('ADMIN', 'GERENTE');

            if (podeEditar) {
                document.getElementById('btnNovoProduto').classList.remove('d-none');
            }

            // Mensagem deixada pela tela de cadastro antes de voltar para cá
            const aviso = sessionStorage.getItem('aviso');
            if (aviso) {
                mostrarMensagem(mensagem, aviso, 'sucesso');
                sessionStorage.removeItem('aviso');
            }

            async function carregar() {
                try {
                    const produtos = await api('/api/produtos');
                    if (produtos.length === 0) {
                        tabela.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-5">Nenhum produto cadastrado.</td></tr>';
                        return;
                    }
                    tabela.innerHTML = produtos.map(p => `
                        <tr>
                            <td class="ps-4">${escapeHtml(p.nome)}</td>
                            <td>${escapeHtml(p.tipo || '-')}</td>
                            <td class="text-end">${p.preco != null ? moeda(p.preco) : '-'}</td>
                            <td><span class="badge ${p.ativo ? 'bg-success' : 'bg-secondary'}">${p.ativo ? 'Sim' : 'Não'}</span></td>
                            <td class="text-end pe-4">
                                ${podeEditar ? `
                                <a href="/produtos/editar/${escapeHtml(p.id)}" class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-pencil-fill"></i> Editar
                                </a>
                                <button class="btn btn-sm btn-outline-danger" data-excluir="${escapeHtml(p.id)}">
                                    <i class="bi bi-trash-fill"></i> Excluir
                                </button>` : ''}
                            </td>
                        </tr>`).join('');
                } catch (e) {
                    tabela.innerHTML = '';
                    mostrarMensagem(mensagem, e.message, 'erro');
                }
            }

            // Um único "ouvinte" para todos os botões Excluir da tabela
            tabela.addEventListener('click', async (evento) => {
                const botao = evento.target.closest('[data-excluir]');
                if (!botao || !confirm('Tem certeza que deseja excluir este produto?')) {
                    return;
                }
                try {
                    await api('/api/produtos/' + botao.dataset.excluir, 'DELETE');
                    mostrarMensagem(mensagem, 'Produto excluído.', 'sucesso');
                    carregar();
                } catch (e) {
                    mostrarMensagem(mensagem, e.message, 'erro');
                }
            });

            carregar();
        })();
    </script>

</div>

</body>
</html>
