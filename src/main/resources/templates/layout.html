<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Token CSRF para as chamadas fetch() das telas (ex.: excluir cliente) -->
        <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
        <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''">
        <title>Pediu Patrão - Sistema de Pedidos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <script>
            // ============================================================
            // Funções usadas pelas telas que consomem a API REST
            // ============================================================

            // Cabeçalho CSRF para fetch(): o Spring Security exige o token em POST/PUT/DELETE
            function csrfHeaders(extra) {
                const token = document.querySelector('meta[name="_csrf"]').content;
                const header = document.querySelector('meta[name="_csrf_header"]').content;
                const h = Object.assign({}, extra || {});
                if (token && header) { h[header] = token; }
                return h;
            }

            // Chama a API com JSON + CSRF. Em caso de erro, lança Error com a mensagem
            // que veio do backend (ApiExceptionHandler / AcessoNegadoHandler).
            async function api(url, metodo, corpo) {
                const opcoes = { method: metodo || 'GET', headers: csrfHeaders({ 'Accept': 'application/json' }) };
                if (corpo !== undefined) {
                    opcoes.headers['Content-Type'] = 'application/json';
                    opcoes.body = JSON.stringify(corpo);
                }
                const resposta = await fetch(url, opcoes);
                if (resposta.status === 204) { return null; }
                let dados = null;
                try { dados = await resposta.json(); } catch (e) { /* resposta sem corpo */ }
                if (!resposta.ok) {
                    let mensagem = (dados && dados.mensagem) || ('Erro ' + resposta.status);
                    if (resposta.status === 401) { mensagem = 'Sessão expirada. Faça login novamente.'; }
                    if (dados && dados.detalhes && dados.detalhes.length) { mensagem += ' ' + dados.detalhes.join('; '); }
                    throw new Error(mensagem);
                }
                return dados;
            }

            // Evita injeção de HTML ao montar tabelas com dados do servidor
            function escapeHtml(valor) {
                return String(valor ?? '').replace(/[&<>"']/g, c => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                })[c]);
            }

            function moeda(valor) {
                return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            }

            // Data/hora vinda da API (LocalDateTime em ISO). Corta frações além dos milissegundos.
            function dataHora(valor, comSegundos) {
                if (!valor) { return '-'; }
                const data = new Date(String(valor).replace(/(\.\d{3})\d+/, '$1'));
                return data.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: comSegundos ? 'medium' : 'short' });
            }

            // Perfil do usuário logado (marcadores gerados pelo sec:authorize logo abaixo do <body>).
            // Serve só para mostrar ou esconder botões; quem garante a permissão é o backend.
            function temPerfil(...perfis) {
                return perfis.some(p => document.getElementById('perfil-' + p) !== null);
            }

            // Mensagem de sucesso/erro dentro do elemento informado
            function mostrarMensagem(elemento, texto, tipo) {
                elemento.innerHTML = texto
                    ? `<div class="alert alert-${tipo === 'erro' ? 'danger' : 'success'} alert-dismissible fade show" role="alert">
                           ${escapeHtml(texto)}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`
                    : '';
            }

            function badgeStatus(status, descricao) {
                const cores = {
                    RECEBIDO: 'bg-secondary', EM_PREPARACAO: 'bg-warning text-dark', PRONTO: 'bg-info text-dark',
                    SAIU_PARA_ENTREGA: 'bg-primary', RETIRADO: 'bg-primary', FINALIZADO: 'bg-success', CANCELADO: 'bg-danger'
                };
                return `<span class="badge ${cores[status] || 'bg-light text-dark'}">${escapeHtml(descricao || status)}</span>`;
            }
        </script>
    </head>
    <body>
        <!-- Marcadores de perfil para o JavaScript (ver temPerfil) -->
        <span id="perfil-ADMIN" sec:authorize="hasRole('ADMIN')" hidden></span>
        <span id="perfil-GERENTE" sec:authorize="hasRole('GERENTE')" hidden></span>
        <span id="perfil-ATENDENTE" sec:authorize="hasRole('ATENDENTE')" hidden></span>

        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="container-fluid mt-4">
            <div th:replace="~{__${content}__}"></div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
